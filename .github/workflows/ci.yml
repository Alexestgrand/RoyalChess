name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: royal
          POSTGRES_PASSWORD: royal
          POSTGRES_DB: royal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U royal -d royal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      INTEGRATION_TEST: "1"
      DATABASE_URL: postgresql://royal:royal@localhost:5432/royal_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      JWT_REFRESH_SECRET: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
      CORS_ORIGIN: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      INTERNAL_AUTH_BRIDGE_SECRET: "int-bridge-secret-16chars!!"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma migrate (API)
        run: pnpm --filter @royalchess/api exec prisma migrate deploy --schema src/prisma/schema.prisma

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
